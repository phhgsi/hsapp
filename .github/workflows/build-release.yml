name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version / Tag (e.g. v2.0.2)'
        required: true
        default: 'v2.0.2'
        type: string
      release_description:
        description: 'Release Description / Changelog'
        required: false
        default: 'Hamare Shikshak APK Release'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android Build Tools
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> $GITHUB_ENV
          echo "Using Android build tools from $BUILD_TOOLS_DIR"

      - name: Download Apktool
        run: |
          curl -sLo /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.0/apktool_2.11.0.jar
          java -jar /tmp/apktool.jar --version

      - name: Prepare Signing Keystore
        env:
          CUSTOM_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          DEFAULT_KEYSTORE: ""
        run: |
          if [ -n "$CUSTOM_KEYSTORE" ]; then
            echo "Using custom KEYSTORE_BASE64 secret..."
            echo "$CUSTOM_KEYSTORE" | tr -d ' \n\r' | base64 -d > release.jks
          else
            echo "Using default release keystore..."
            echo "$DEFAULT_KEYSTORE" | tr -d ' \n\r' | base64 -d > release.jks
          fi

      - name: Build APK with Apktool
        run: |
          mkdir -p build
          java -jar /tmp/apktool.jar b . -o build/app-unsigned-unaligned.apk

      - name: Zipalign APK
        run: |
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 build/app-unsigned-unaligned.apk build/app-aligned.apk

      - name: Sign APK with apksigner
        run: |
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.jks \
            --ks-key-alias hsapp \
            --ks-pass pass:android123 \
            --key-pass pass:android123 \
            --out "HamareShikshak-${{ inputs.version }}.apk" \
            build/app-aligned.apk

      - name: Verify Signed APK
        run: |
          "$BUILD_TOOLS_DIR/apksigner" verify -v "HamareShikshak-${{ inputs.version }}.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HamareShikshak-${{ inputs.version }}
          path: HamareShikshak-${{ inputs.version }}.apk

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Release ${{ inputs.version }} exists. Updating release notes and uploading asset..."
            gh release edit "${{ inputs.version }}" --title "${{ inputs.version }}" --notes "${{ inputs.release_description }}"
            gh release upload "${{ inputs.version }}" "HamareShikshak-${{ inputs.version }}.apk" --clobber
          else
            echo "Creating new release ${{ inputs.version }}..."
            gh release create "${{ inputs.version }}" "HamareShikshak-${{ inputs.version }}.apk" \
              --title "${{ inputs.version }}" \
              --notes "${{ inputs.release_description }}"
          fi
